# Supabase — config local do projeto Flow Leads.
# project_id = ref do projeto (usado por `supabase link` / deploy).
project_id = "lyitsavnqwtsoouhcjie"

[functions.search-leads]
# Busca de leads via Google Places. Recebe o JWT do usuário (RLS).
verify_jwt = true

[functions.enrich-lead]
# Visita o site do lead e extrai e-mail/WhatsApp. Recebe o JWT do usuário.
verify_jwt = true

[functions.redesign-site]
# Gera o site novo do lead via IA (OpenAI). Recebe o JWT do usuário.
verify_jwt = true

[functions.test-apify]
enabled = true
verify_jwt = false
import_map = "./functions/test-apify/deno.json"
# Uncomment to specify a custom file path to the entrypoint.
# Supported file extensions are: .ts, .js, .mjs, .jsx, .tsx
entrypoint = "./functions/test-apify/index.ts"
# Specifies static files to be bundled with the function. Supports glob patterns.
# For example, if you want to serve static HTML pages in your function:
# static_files = [ "./functions/test-apify/*.html" ]
